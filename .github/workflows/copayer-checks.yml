name: English Co-Player PoC checks

on:
  push:
  pull_request:

jobs:
  unit-and-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: node --test poc/tests/*.test.mjs
